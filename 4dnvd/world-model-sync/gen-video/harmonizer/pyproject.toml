[project]
name = "harmonizer"
version = "0.1.0"
description = "Bridging Neural Reconstruction and Photorealistic Simulation with Online Diffusion Enhancer"
authors = [{ name = "NVIDIA" }]
requires-python = ">=3.10,<3.11"

# Keep Python runtime deps out of this section.
# setup_env.py installs torch first with the correct CUDA build,
# then installs runtime deps.
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]

# Compatible with both old Pixi and new Pixi.
# Do not use inline tables like:
#   { platform = "linux-64", cuda = "12.6" }
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.pypi-options]
index-strategy = "unsafe-best-match"

[tool.pixi.dependencies]
python = "3.10.*"
pip = "*"
uv = "*"
packaging = "*"

ffmpeg = "<5"
# Use the server-provided /usr/bin/git on UMD. The Conda git package pulls Perl files with colon names, which /fs rejects.
# git = "*"
curl = "*"
wget = "*"
just = "==1.42.4"

cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
make = "*"
patchelf = "*"

# ----------------------------
# A100 / x86_64
# ----------------------------
[tool.pixi.target.linux-64.dependencies]
cuda-toolkit = "12.6.*"
cuda-nvtx-dev = "*"
gxx_linux-64 = "*"
cudnn = ">=9,<10"

# ----------------------------
# GB200 / aarch64
# ----------------------------
[tool.pixi.target.linux-aarch64.dependencies]
cuda-toolkit = ">=12.8,<13"
cuda-nvtx-dev = "*"
gxx_linux-aarch64 = "*"
cudnn = ">=9,<10"

[tool.pixi.activation.env]
CPATH = "$CONDA_PREFIX/include:$CPATH"
LIBRARY_PATH = "$CONDA_PREFIX/lib:$LIBRARY_PATH"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
CMAKE_PREFIX_PATH = "$CONDA_PREFIX:$CMAKE_PREFIX_PATH"
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"

[tool.pixi.tasks]
install-runtime-extras = """
uv pip install --python "$(python -c 'import sys; print(sys.executable)')" \
  lpips \
  natsort \
  clean-fid \
  vision-aided-loss
"""

setup-x86 = """
COSMOS_PLATFORM=x86 python setup_env_a100.py && \
uv pip install --python "$(python -c 'import sys; print(sys.executable)')" \
  lpips \
  natsort \
  clean-fid \
  vision-aided-loss
"""

setup-gb200 = """
COSMOS_PLATFORM=gb200 python setup_env_gb200.py && \
uv pip install --python "$(python -c 'import sys; print(sys.executable)')" \
  lpips \
  natsort \
  clean-fid \
  vision-aided-loss
"""

check-platform = """
python - <<'PY'
import platform
import subprocess

print("machine:", platform.machine())

try:
    out = subprocess.check_output(
        ["nvidia-smi", "--query-gpu=name", "--format=csv,noheader"],
        text=True,
    )
    print("gpu:", out.strip())
except Exception as e:
    print("gpu unavailable:", e)
PY
"""

check-torch = """
python - <<'PY'
import torch

print("torch:", torch.__version__)
print("cuda build:", torch.version.cuda)
print("cuda available:", torch.cuda.is_available())

if torch.cuda.is_available():
    print("device:", torch.cuda.get_device_name(0))
    print("capability:", torch.cuda.get_device_capability(0))

    x = torch.ones(1, device="cuda") + 1
    torch.cuda.synchronize()
    print("cuda tensor test:", x.cpu())
PY
"""

check-imports = """
python - <<'PY'
mods = [
    "torch",
    "torchvision",
    "cosmos_predict2",
    "qwen_vl_utils",
    "loguru",
    "attrs",
    "lpips",
    "natsort",
]

for m in mods:
    __import__(m)
    print("OK", m)
PY
"""

inference = "cd $PIXI_PROJECT_ROOT/src && python inference_pix2pix_turbo_harmonizer.py --input_image ../examples --model_path ../models/diffusion_harmonizer.pkl --model_identifier 'harmonizer_inference' --timestep 250 --resolution 1024 --use_sched"