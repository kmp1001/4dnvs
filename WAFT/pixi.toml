[workspace]
name = "waft"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
torch = "==2.7.0+cu128"
torchvision = "==0.22.0+cu128"
xformers = "==0.0.30"
timm = "==1.0.20"
numpy = "<2"
gradio = "==4.29.0"
gradio-imageslider = "*"
huggingface-hub = "<1"
matplotlib = "*"
opencv-python = "<4.12"
scipy = "*"
tensorboard = "*"
h5py = "*"
tqdm = "*"
einops = "*"
wandb = "*"
click = "*"

[tasks]
check-env = "python -c 'import torch, torchvision, xformers, timm; print(torch.__version__, torchvision.__version__, xformers.__version__, timm.__version__); print(\"CUDA available:\", torch.cuda.is_available())'"
